<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>morph</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  :root {
    --motion-fast: 160ms;
    --motion-base: 240ms;
    --motion-slow: 360ms;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #stamp {
    position: fixed;
    bottom: 20px;
    left: 16px;
    font: 10px/1.4 system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.3px;
    pointer-events: none;
    z-index: 10;
  }
  #legend {
    position: fixed;
    bottom: 44px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font: 10px/1 system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,0.35);
    pointer-events: none;
    z-index: 10;
  }
  #legend canvas { position: static; width: 20px; height: 20px; }
  #legend .sep { opacity: 0.3; }
  #desc {
    position: fixed;
    bottom: 68px;
    left: 0; right: 0;
    text-align: center;
    font: 11px/1.5 system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,0.45);
    padding: 0 24px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stamp">Open-Meteo Marine · loading…</div>
<div id="legend">
  <canvas id="leg-cold" width="40" height="40"></canvas>
  <span>0°C</span>
  <span class="sep">—</span>
  <canvas id="leg-warm" width="40" height="40"></canvas>
  <span>35°C</span>
</div>
<div id="desc">Sea surface temperature shapes each polygon — warmer waters bloom into more sides; wave height sets the pulse rhythm.</div>
<script>
const C = {
  cities: [
    { name: 'San Francisco', lat: 37.77, lon: -122.42, fallbackSST: 14.2, fallbackWave: 2.1 },
    { name: 'Reykjavik',    lat: 64.15, lon: -21.95, fallbackSST: 7.8,  fallbackWave: 1.4 },
    { name: 'Sydney',       lat: -33.87, lon: 151.21, fallbackSST: 22.5, fallbackWave: 1.8 },
    { name: 'Mumbai',       lat: 19.08, lon: 72.88,  fallbackSST: 28.3, fallbackWave: 0.9 },
    { name: 'Cape Town',    lat: -33.92, lon: 18.42,  fallbackSST: 17.6, fallbackWave: 2.4 },
  ],
  layout: [
    { x: 0.14, y: 0.48 },
    { x: 0.30, y: 0.36 },
    { x: 0.50, y: 0.42 },
    { x: 0.70, y: 0.36 },
    { x: 0.86, y: 0.48 },
  ],
  minSides: 3,
  maxSides: 12,
  sstMin: 0,
  sstMax: 35,
  waveMin: 0,
  waveMax: 8,
  baseRadius: 52,
  radiusScale: 1,
  pulseMin: 800,
  pulseMax: 3000,
  selectedScale: 1.1,
  dimAlpha: 0.15,
  fieldAlpha: 0.25,
  activeAlpha: 0.7,
  fadeInDuration: 360,
  fadeInStagger: 200,
  inactivityMs: 3000,
  fetchInterval: 120000,
  apiBase: 'https://marine-api.open-meteo.com/v1/marine',
};

const P = {
  bg: '#0a0a0a',
  secondary: '#141414',
  accent: '#e0e0e0',
  glow: 'rgba(224,224,224,0.15)',
  text: 'rgba(255,255,255,0.5)',
  warmth: 'rgba(200,200,200,0.55)',
};

const SW = { hair: 0.5, fine: 1, medium: 2, heavy: 4 };
const A = { bg: 0.08, field: 0.25, active: 0.7, label: 0.45 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stampEl = document.getElementById('stamp');

let dpr = 1, W = 0, H = 0;
let tapping = false;
let selectedIdx = -1;
let selectionStrength = 0;
let lastInteraction = 0;
let lastFetchTime = 0;
let liveCount = 0;
let t0 = performance.now();

const organisms = C.cities.map((city, i) => ({
  ...city,
  sst: city.fallbackSST,
  wave: city.fallbackWave,
  sides: sidesFromSST(city.fallbackSST),
  pulseMs: pulseFromWave(city.fallbackWave),
  fadeIn: 0,
  fadeStarted: false,
  isFallback: true,
  lx: C.layout[i].x,
  ly: C.layout[i].y,
}));

function map(v, inMin, inMax, outMin, outMax) {
  const t = (v - inMin) / (inMax - inMin);
  return outMin + Math.max(0, Math.min(1, t)) * (outMax - outMin);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function sidesFromSST(sst) {
  return Math.round(clamp(map(sst, C.sstMin, C.sstMax, C.minSides, C.maxSides), C.minSides, C.maxSides));
}

function pulseFromWave(wave) {
  return map(clamp(wave, C.waveMin, C.waveMax), C.waveMin, C.waveMax, C.pulseMax, C.pulseMin);
}

function easeOutExpo(t) {
  return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  C.baseRadius = Math.min(W, H) * 0.065;
}

function cityPos(org) {
  const arc = Math.sin(org.lx * Math.PI) * H * 0.04;
  return { x: org.lx * W, y: org.ly * H + arc };
}

function drawPolygon(cx, cy, r, sides, rot, stroke, fill, lw) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + (i * Math.PI * 2 / sides) - Math.PI / 2;
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function pulseFactor(org, now) {
  const phase = ((now - t0) % org.pulseMs) / org.pulseMs;
  const breath = 0.5 + 0.5 * Math.sin(phase * Math.PI * 2);
  return 0.88 + breath * 0.12;
}

function rotationAngle(org, now) {
  return ((now - t0) / org.pulseMs) * Math.PI * 0.15;
}

function hitTest(px, py) {
  let best = -1, bestD = Infinity;
  organisms.forEach((org, i) => {
    const pos = cityPos(org);
    const r = C.baseRadius * (i === selectedIdx ? C.selectedScale : 1) * 1.3;
    const d = Math.hypot(px - pos.x, py - pos.y);
    if (d < r && d < bestD) { best = i; bestD = d; }
  });
  return best;
}

function selectCity(idx) {
  selectedIdx = idx;
  lastInteraction = performance.now();
  selectionStrength = 1;
}

function updateFadeIn(now) {
  organisms.forEach((org, i) => {
    const start = t0 + i * C.fadeInStagger;
    if (now >= start) {
      org.fadeStarted = true;
      const elapsed = now - start;
      org.fadeIn = easeOutExpo(clamp(elapsed / C.fadeInDuration, 0, 1));
    }
  });
}

function updateSelection(now) {
  if (selectedIdx < 0) {
    selectionStrength = Math.max(0, selectionStrength - 0.02);
    return;
  }
  const idle = now - lastInteraction;
  if (idle > C.inactivityMs) {
    selectionStrength = Math.max(0, selectionStrength - 0.015);
    if (selectionStrength <= 0.01) selectedIdx = -1;
  }
}

function drawLegendIcons() {
  const coldC = document.getElementById('leg-cold');
  const warmC = document.getElementById('leg-warm');
  [coldC, warmC].forEach(c => {
    const cx = c.getContext('2d');
    cx.clearRect(0, 0, 40, 40);
    cx.setTransform(1, 0, 0, 1, 0, 0);
  });
  const cc = coldC.getContext('2d');
  cc.strokeStyle = P.accent;
  cc.lineWidth = 1;
  cc.globalAlpha = 0.5;
  cc.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = (i * Math.PI * 2 / 3) - Math.PI / 2;
    const px = 20 + Math.cos(a) * 8;
    const py = 20 + Math.sin(a) * 8;
    if (i === 0) cc.moveTo(px, py); else cc.lineTo(px, py);
  }
  cc.closePath();
  cc.stroke();

  const wc = warmC.getContext('2d');
  wc.strokeStyle = P.accent;
  wc.lineWidth = 0.8;
  wc.globalAlpha = 0.5;
  wc.beginPath();
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI * 2 / 12) - Math.PI / 2;
    const px = 20 + Math.cos(a) * 8;
    const py = 20 + Math.sin(a) * 8;
    if (i === 0) wc.moveTo(px, py); else wc.lineTo(px, py);
  }
  wc.closePath();
  wc.stroke();
}

function updateStamp(now) {
  const ago = lastFetchTime > 0
    ? Math.round((now - lastFetchTime) / 1000)
    : 0;
  if (!lastFetchTime) {
    stampEl.textContent = 'Open-Meteo Marine · loading…';
    return;
  }
  const n = organisms.length;
  const mode = liveCount === n ? 'live' : liveCount === 0 ? 'fallback' : `${liveCount}/${n} live`;
  const sstStr = selectedIdx >= 0
    ? `${organisms[selectedIdx].name} SST ${organisms[selectedIdx].sst.toFixed(1)}°C`
    : `mean SST ${(organisms.reduce((s, o) => s + o.sst, 0) / n).toFixed(1)}°C · ${n} cities`;
  stampEl.textContent = `Open-Meteo Marine · ${sstStr} · updated ${ago}s ago · ${mode}`;
}

function draw(now) {
  updateFadeIn(now);
  updateSelection(now);

  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = A.bg;
  for (let i = 0; i < 6; i++) {
    const gy = H * (0.15 + i * 0.14);
    ctx.strokeStyle = P.secondary;
    ctx.lineWidth = SW.hair;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }
  ctx.restore();

  organisms.forEach((org, i) => {
    const pos = cityPos(org);
    const isSelected = i === selectedIdx;
    const sel = isSelected ? selectionStrength : 0;

    let baseAlpha = A.field;
    if (isSelected) baseAlpha = A.active;
    else if (selectedIdx >= 0) baseAlpha = C.dimAlpha;
    const alpha = org.fadeIn * baseAlpha;

    const scale = pulseFactor(org, now) * (isSelected ? 1 + (C.selectedScale - 1) * sel : 1);
    const r = C.baseRadius * scale;
    const rot = rotationAngle(org, now);

    ctx.save();
    ctx.globalAlpha = alpha;

    if (isSelected && sel > 0.1) {
      ctx.shadowColor = P.glow;
      ctx.shadowBlur = 24 * sel;
    } else if (!isSelected && selectedIdx < 0) {
      ctx.shadowColor = P.glow;
      ctx.shadowBlur = 8;
    }

    drawPolygon(pos.x, pos.y, r, org.sides, rot, P.accent, null, SW.fine);

    ctx.shadowBlur = 0;

    if (org.fadeIn > 0.1) {
      // Labels get their own alpha so they stay readable next to the faint outlines
      ctx.globalAlpha = org.fadeIn * (selectedIdx >= 0 && !isSelected ? 0.35 : 1);
      ctx.fillStyle = P.warmth;
      ctx.font = '11px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${org.sst.toFixed(1)}°C · wave ${org.wave.toFixed(1)}m`, pos.x, pos.y + r + 16);
      ctx.fillStyle = P.text;
      ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
      ctx.fillText(org.name, pos.x, pos.y + r + 32);
    }

    if (isSelected && sel > 0.05) {
      const heroSize = clamp(C.baseRadius * 1.1, 48, 72);
      ctx.globalAlpha = alpha * sel;
      ctx.fillStyle = P.accent;
      ctx.font = `300 ${heroSize}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(org.sst.toFixed(1), pos.x, pos.y - 4);
      ctx.font = '11px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = P.warmth;
      ctx.fillText(org.name, pos.x, pos.y + heroSize * 0.38);
      ctx.font = '9px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = P.text;
      ctx.fillText(`wave ${org.wave.toFixed(1)}m`, pos.x, pos.y + heroSize * 0.38 + 14);
      ctx.textBaseline = 'alphabetic';
    }

    ctx.restore();
  });

  updateStamp(now);
}

function loop(now) {
  draw(now);
  requestAnimationFrame(loop);
}

async function fetchCity(org) {
  const url = `${C.apiBase}?latitude=${org.lat}&longitude=${org.lon}&daily=sea_surface_temperature_max,wave_height_max&timezone=auto&forecast_days=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  const sst = data.daily?.sea_surface_temperature_max?.[0];
  const wave = data.daily?.wave_height_max?.[0];
  if (sst == null || wave == null) throw new Error('missing fields');
  return { sst, wave };
}

async function fetchAll() {
  const results = await Promise.allSettled(
    organisms.map(org => fetchCity(org))
  );
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      organisms[i].sst = r.value.sst;
      organisms[i].wave = r.value.wave;
      organisms[i].sides = sidesFromSST(r.value.sst);
      organisms[i].pulseMs = pulseFromWave(r.value.wave);
      organisms[i].isFallback = false;
    }
  });
  liveCount = organisms.filter(o => !o.isFallback).length;
  lastFetchTime = performance.now();
}

canvas.addEventListener('touchstart', (e) => {
  tapping = true;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const idx = hitTest(t.clientX - rect.left, t.clientY - rect.top);
  if (idx >= 0) selectCity(idx);
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', () => { tapping = false; });

canvas.addEventListener('click', (e) => {
  if (tapping) return;
  const rect = canvas.getBoundingClientRect();
  const idx = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if (idx >= 0) selectCity(idx);
});

window.addEventListener('resize', resize);

resize();
drawLegendIcons();
requestAnimationFrame(loop);
fetchAll();
setInterval(fetchAll, C.fetchInterval);
</script>
</body>
</html>
